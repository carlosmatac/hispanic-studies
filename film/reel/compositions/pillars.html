  <script>
    (() => {
      const B = 60 / 112;
      const bar = (n) => n * 4 * B;
      const tl = gsap.timeline({ paused: true });

      // each pillar: the plate rises out of the paper in steps, the word lands a beat later,
      // the caption after it; the plate keeps a slow push while the shot holds
      [["#pil-a", -1], ["#pil-b", 1], ["#pil-c", -1]].forEach(([id, side], i) => {
        const t0 = bar(i);
        tl.fromTo(`${id} .pil-plate`, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(5)" }, t0);
        tl.fromTo(`${id} .pil-plate img`, { scale: 1.12 }, { scale: 1.0, duration: bar(1), ease: "power2.out" }, t0);
        tl.fromTo(`${id} .pil-word span`, { opacity: 0, x: 60 * side, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t0 + B - 0.08);
        tl.fromTo(`${id} .pil-cap`, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t0 + 2 * B);
      });

      // bar 20: one continuous camera on the engraved portico (image pixels, 2400 x 1792)
      const T = bar(3);
      const cam = (cx, cy, k) => ({ x: 960 - cx * k, y: 540 - cy * k, scale: k });
      const fit = { x: (1920 - 2400 * (1080 / 1792)) / 2, y: 0, scale: 1080 / 1792 };
      tl.fromTo("#pil-world", cam(1197, 1250, 2.1), { ...cam(1197, 470, 2.1), duration: 0.5, ease: "power2.inOut" }, T);
      tl.fromTo("#pil-world", cam(1197, 470, 2.1), { ...fit, duration: 0.95, ease: "expo.inOut", immediateRender: false }, T + 0.42);
      // the three pillars light one a beat: the middle one first, under the camera
      [[1, 0], [0, 1], [2, 2]].forEach(([i, k]) => {
        tl.fromTo("#pil-sh" + i, { opacity: 0 }, { opacity: 0.92, duration: 0.18, ease: "power2.out" }, T + k * B);
        tl.fromTo("#pil-w" + i + " span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, T + k * B + 0.04);
      });
      // the name lands on the architrave on the fourth beat, then the works fill the metopes
      tl.fromTo("#pil-arch", { opacity: 0, scaleX: 1.35 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out" }, T + 3 * B - 0.25);
      tl.fromTo(".pil-met", { opacity: 0 }, { opacity: 1, duration: 0.08, stagger: 0.045 }, T + 1.4);

      tl.fromTo("#pil-world", fit, { ...cam(367, 210, 9), duration: 0.32, ease: "power3.in", immediateRender: false }, T + 4 * B - 0.32);
