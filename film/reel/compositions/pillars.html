  <script>
    (() => {
      const B = 60 / 112;
      // the music comes back at 0 (32.58 s in the film) and climbs on A to the drop at
      // 9.534 s: a painting every 2.27 s, then the portico, its camera on the track's quarters
      const P = 2.27, T = 6.81, Q = (9.534 - 6.81) / 4;
      const tl = gsap.timeline({ paused: true });

      // MESTIZAJE: the word opens on the paper with the painting inside it, then the camera
      // flies through its first letter into the painting itself
      tl.fromTo("#pil-a-word", { clipPath: "inset(0% 50% 0% 50%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "steps(7)" }, 0);
      tl.fromTo("#pil-a-word", { backgroundPosition: "50% 30%" }, { backgroundPosition: "50% 50%", duration: 1.0, ease: "none" }, 0);
      tl.fromTo("#pil-a-word", { scale: 1, filter: "blur(0px)" }, { scale: 26, filter: "blur(6px)", duration: 0.5, ease: "power3.in" }, 0.62);
      tl.fromTo("#pil-a-full", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "none" }, 0.96);
      tl.fromTo("#pil-a-full img", { scale: 1.35, filter: "blur(18px)" }, { scale: 1.06, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.98);
      tl.fromTo("#pil-a-full img", { scale: 1.06 }, { scale: 1.0, duration: 0.8, ease: "none", immediateRender: false }, 1.48);
      tl.fromTo("#pil-a .pil-title span", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 1.1);
      tl.fromTo("#pil-a .pil-cap", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.3);

      // CATOLICISMO: a vertical whip, then the camera climbs the façade; the letters drop in on the beat
      const b0 = P;
      tl.fromTo("#pil-b-full img", { y: -1600, filter: "blur(20px)" }, { y: -1370, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, b0);
      tl.fromTo("#pil-b-full img", { y: -1370 }, { y: -420, duration: P - 0.2, ease: "power1.inOut", immediateRender: false }, b0 + 0.2);
      const bw = document.getElementById("pil-b-word");
      bw.innerHTML = [...bw.textContent].map((c) => `<span>${c}</span>`).join("");
      tl.fromTo("#pil-b-word span", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.035, ease: "expo.out" }, b0 + B - 0.1);
      tl.fromTo("#pil-b .pil-cap", { opacity: 0 }, { opacity: 1, duration: 0.25 }, b0 + 2 * B);

      // LENGUA: a horizontal whip onto the Codex, the camera reads across it; the word is written
      const c0 = 2 * P;
      tl.fromTo("#pil-c-full img", { x: 120, y: -640, filter: "blur(20px)" }, { x: -40, y: -640, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, c0);
      tl.fromTo("#pil-c-full img", { x: -40, y: -640 }, { x: -170, y: -780, duration: P - 0.2, ease: "none", immediateRender: false }, c0 + 0.2);
      tl.fromTo("#pil-c-word", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, c0 + B - 0.1);
      tl.fromTo("#pil-c-langs", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, c0 + 1.3);
      tl.fromTo("#pil-c .pil-cap", { opacity: 0 }, { opacity: 1, duration: 0.25 }, c0 + 2 * B);

      // one continuous camera on the engraved portico (image pixels, 2400 x 1792)
      const cam = (cx, cy, k) => ({ x: 960 - cx * k, y: 540 - cy * k, scale: k });
      const fit = { x: (1920 - 2400 * (1080 / 1792)) / 2, y: 0, scale: 1080 / 1792 };
      tl.fromTo("#pil-world", cam(1197, 1250, 2.1), { ...cam(1197, 470, 2.1), duration: 0.62, ease: "power2.inOut" }, T);
      tl.fromTo("#pil-world", cam(1197, 470, 2.1), { ...fit, duration: 1.2, ease: "expo.inOut", immediateRender: false }, T + 0.53);
      // the three pillars light one a beat: the middle one first, under the camera
      [[1, 0], [0, 1], [2, 2]].forEach(([i, k]) => {
        tl.fromTo("#pil-sh" + i, { opacity: 0 }, { opacity: 0.92, duration: 0.18, ease: "power2.out" }, T + k * Q);
        tl.fromTo("#pil-w" + i + " span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, T + k * Q + 0.04);
      });
      // the name lands on the architrave on the fourth beat, then the works fill the metopes
      tl.fromTo("#pil-arch", { opacity: 0, scaleX: 1.35 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "expo.out" }, T + 3 * Q - 0.25);
      tl.fromTo(".pil-met", { opacity: 0 }, { opacity: 1, duration: 0.08, stagger: 0.045 }, T + 1.78);
      // and the camera dives into "Watch", the first of them, landing on the drop (the metopes are
      // in the film's order, so every later shot can leave by the same frieze, always to the right)
      tl.fromTo("#pil-world", fit, { ...cam(367, 210, 9), duration: 0.32, ease: "power3.in", immediateRender: false }, T + 4 * Q - 0.32);

      window.__timelines["pillars"] = tl;
