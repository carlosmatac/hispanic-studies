      // the canon: fifty dots fall onto their years, left to right
      word("#wk-canon", bar(2)); fig("#wk-canon", bar(2) + B);

      // the Atlas: sixty, the same way, over twelve centuries
      word("#wk-atlas", bar(3)); fig("#wk-atlas", bar(3) + B);
      tl.fromTo("#wk-atlas .wk-dot", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.018, ease: "power3.out" }, bar(3) + 0.1);
      tl.fromTo("#wk-atlas .wk-tick", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.2 }, bar(3) + 0.3);

      // books: the spines rise onto the shelf, one an eighth note apart
      word("#wk-books", bar(4)); fig("#wk-books", bar(4) + B);
      tl.fromTo(".wk-spine", { yPercent: 105 }, { yPercent: 0, duration: 0.45, stagger: B / 2, ease: "expo.out" }, bar(4));

      // follow: a figure on each beat
