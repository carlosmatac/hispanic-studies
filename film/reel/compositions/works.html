          <p id="fz-m2" class="fz-met" style="left: 915px; width: 227px">Canon</p>
          <p id="fz-m3" class="fz-met" style="left: 1248px; width: 227px">Atlas</p>
          <p id="fz-m4" class="fz-met" style="left: 1582px; width: 226px">Books</p>
          <p id="fz-m5" class="fz-met" style="left: 1916px; width: 218px">Community</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const B = 60 / 112;
      const tl = gsap.timeline({ paused: true });
      // a title arrives out of the metope the camera dived into: large in the middle, then home
      const arrive = (sel, t, dx, dy) => tl.fromTo(sel, { scale: 2.4, x: dx, y: dy }, { scale: 1, x: 0, y: 0, duration: 0.7, ease: "expo.out" }, t);
      const fig = (id, t) => tl.fromTo(id + " .wk-fig", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
      // a camera over a world: chained moves, each starting from where the last one ends
      const cam = (cx, cy, k) => ({ x: 960 - cx * k, y: 540 - cy * k, scale: k });
      const move = (sel, from, to, t, d, ease, first) => tl.fromTo(sel, from, { ...to, duration: d, ease, immediateRender: !!first }, t);

      // WATCH: the word arrives out of the portico's metope, large, and settles; the wall slides in
      tl.fromTo("#wk-watch .wk-word", { scale: 2.6, x: 540, y: -200, opacity: 1 }, { scale: 1, x: 0, y: 0, duration: 0.7, ease: "expo.out" }, 0.0);
      tl.fromTo("#wk-wall .wk-thumb", { x: 900 }, { x: 0, duration: 0.5, stagger: 0.11, ease: "expo.out" }, 0.0 + 0.1);
      fig("#wk-watch", 0.0 + 0.6 * B);

      // READ: eight essays fly in from the depth into a turning ring, then fold into a wall
      arrive("#wk-read .wk-word", 2.1429, 660, 383); fig("#wk-read", 2.1429 + B);
      const grid = [[-705, -165], [-235, -165], [235, -165], [705, -165], [-705, 165], [-235, 165], [235, 165], [705, 165]];
      for (let i = 0; i < 8; i++) {
        tl.fromTo("#rd-a" + i, { rotationY: i * 45 }, { rotationY: i * 45, duration: 0.01 }, 2.1429);
        tl.fromTo("#rd-c" + i, { z: -2600, opacity: 0, y: (i % 2 ? 70 : -70) }, { z: 760, opacity: 1, y: (i % 2 ? 70 : -70), duration: 0.8, ease: "expo.out" }, 2.1429 + i * 0.06);
        // the fold: arms straighten, cards come forward into a tilted wall of two rows
        tl.fromTo("#rd-a" + i, { rotationY: i * 45 }, { rotationY: 0, duration: 0.85, ease: "power3.inOut", immediateRender: false }, 2.1429 + 2.35 + i * 0.03);
        tl.fromTo("#rd-c" + i, { z: 760, x: 0, y: (i % 2 ? 70 : -70) }, { z: 0, x: grid[i][0], y: grid[i][1], duration: 0.85, ease: "power3.inOut", immediateRender: false }, 2.1429 + 2.35 + i * 0.03);
      }
      tl.fromTo("#rd-ring", { rotationY: 30, rotationX: 8 }, { rotationY: -110, rotationX: 8, duration: 2.35, ease: "power1.inOut" }, 2.1429);
      tl.fromTo("#rd-ring", { rotationY: -110, rotationX: 8 }, { rotationY: -372, rotationX: 10, duration: 0.95, ease: "power3.inOut", immediateRender: false }, 2.1429 + 2.35);
      tl.fromTo("#rd-ring", { rotationY: -372, rotationX: 10 }, { rotationY: -366, rotationX: 10, duration: 0.6, ease: "none", immediateRender: false }, 2.1429 + 3.3);

      // THE CANON: the camera starts close on La raza cósmica and pulls out to the whole field,
      // the cards appearing and the edges drawing outwards from it, dots running along them
      arrive("#wk-canon .wk-word", 6.4286, 510, 383); fig("#wk-canon", 6.4286 + 0.8 * B);
      // the camera follows a real chain of readers: Ariel → Rodó → Vasconcelos → La raza cósmica → Haya
      move("#cn-world", cam(1625, 1046, 2.3), cam(1646, 790, 2.3), 6.4286, 0.7, "power2.inOut", true);
      move("#cn-world", cam(1646, 790, 2.3), cam(2014, 1380, 2.0), 6.4286 + 0.75, 0.8, "power2.inOut");
      move("#cn-world", cam(2014, 1380, 2.0), cam(2030, 1520, 2.3), 6.4286 + 1.6, 0.55, "power2.inOut");
      move("#cn-world", cam(2030, 1520, 2.3), cam(1830, 1300, 0.85), 6.4286 + 2.2, 1.3, "expo.inOut");
      move("#cn-world", cam(1830, 1300, 0.85), cam(1830, 1300, 0.8), 6.4286 + 3.5, 0.786, "none");
      const nd = [1.5, 1.5, 1.5, 1.472, 1.388, 1.425, 1.486, 1.007, 0.956, 0.855, 1.225, 1.278, 0.755, 1.5, 0.987, 1.07, 1.147, 1.216, 0.561, 1.053, 0.957, 1.016, 1.107, 1.238, 1.261, 1.354, 0.442, 0.356, 0.497, 0.269, 0.987, 1.081, 0.151, 0.87, 0.473, 0.376, 0.292, 0.994, 1.071, 1.168, 0.491, 0.428, 0.363, 0.281, 0.236, 1.5, 1.5, 0.211, 0.216, 0.25, 0.319, 0.379, 1.008, 1.048, 0.483, 0.549, 0.627, 0.717, 1.116, 1.5, 1.053, 1.221, 1.303, 0.612, 1.49, 0.584, 1.174, 1.5, 0.548, 1.5, 1.146, 1.5, 1.084, 1.024, 0.988, 0.92, 0.816, 1.23, 0.909, 1.211, 1.5, 1.5, 1.5, 1.009, 0.987, 1.5, 1.379, 1.5, 1.5, 1.411, 1.5, 1.5, 1.5];
      document.querySelectorAll("#cn-world .cn-n").forEach((el, i) => tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 6.4286 + nd[i]));
      const ed = [2.3, 0.66, 0.629, 1.471, 1.943, 1.617, 1.431, 0.674, 0.333, 1.974, 1.576, 0.365, 0.865, 0.678, 0.408, 0.273, 0.885, 0.624, 1.087, 0.869, 0.937, 2.187, 1.185, 0.516, 0.443, 2.233, 2.026, 1.544, 1.37, 2.3, 2.045, 1.442, 1.517, 1.845, 0.605, 1.479, 0.666, 0.563, 2.3, 0.385, 0.471, 0.939, 1.667, 0.527, 2.281, 1.507, 2.206];
      document.querySelectorAll("#cn-edges .cn-e").forEach((el, i) => tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 6.4286 + ed[i]));
      tl.fromTo("#cn-edges .cn-s", { strokeDashoffset: 0, opacity: 0 }, { strokeDashoffset: -0.6, opacity: 1, duration: 3.986, ease: "none" }, 6.4286 + 0.3);
      const toChip = (id, slab, chip, t) => {
        tl.fromTo(id + " .wk-word, " + id + " .wk-fig", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.18, immediateRender: false }, t);
        tl.fromTo(slab, { opacity: 0.94 }, { opacity: 0, duration: 0.25, immediateRender: false }, t);
        tl.fromTo(chip, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, t + 0.1);
      };
      tl.fromTo("#cn-slab", { opacity: 0.94 }, { opacity: 0.94, duration: 0.01 }, 6.4286);
      toChip("#wk-canon", "#cn-slab", "#cn-chip", 6.4286 + 1.05);

      // THE ATLAS: the camera follows the milestones over the map, a card at each, then pulls back
      arrive("#wk-atlas .wk-word", 10.7143, 515, 383); fig("#wk-atlas", 10.7143 + 0.8 * B);
      const route = [[1994, 358], [1288, 571], [1053, 600], [1348, 959], [1707, 1042], [3266, 672]];
      const k = 1.25;
      move("#at-world", cam(route[0][0] + 250, route[0][1] + 60, k), cam(route[1][0] + 200, route[1][1], k), 10.7143, 0.55, "power2.inOut", true);
      move("#at-world", cam(route[1][0] + 200, route[1][1], k), cam(route[2][0] - 50, route[2][1] + 60, k), 10.7143 + 0.6, 0.55, "power2.inOut");
      move("#at-world", cam(route[2][0] - 50, route[2][1] + 60, k), cam(route[3][0] - 50, route[3][1] + 40, k), 10.7143 + 1.2, 0.5, "power2.inOut");
      move("#at-world", cam(route[3][0] - 50, route[3][1] + 40, k), cam(route[4][0] + 200, route[4][1] + 40, k), 10.7143 + 1.75, 0.5, "power2.inOut");
      move("#at-world", cam(route[4][0] + 200, route[4][1] + 40, k), cam(1792, 760, 0.56), 10.7143 + 2.3, 1.1, "expo.inOut");
      move("#at-world", cam(1792, 760, 0.56), cam(1792, 760, 0.545), 10.7143 + 3.4, 0.886, "none");
      [0, 0.45, 1.05, 1.62, 2.15, 2.75].forEach((t, i) => {
        tl.fromTo("#at-p" + i, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 10.7143 + t);
        tl.fromTo("#at-l" + i, { strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 10.7143 + t + 0.05);
        tl.fromTo("#at-c" + i, { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 10.7143 + t + 0.12);
      });
      tl.fromTo("#at-slab", { opacity: 0.94 }, { opacity: 0.94, duration: 0.01 }, 10.7143);
      toChip("#wk-atlas", "#at-slab", "#at-chip", 10.7143 + 1.05);

      // BOOKS: the spines rise onto the shelf, one an eighth note apart
      arrive("#wk-books .wk-word", 15.0, 530, 285); fig("#wk-books", 15.0 + 0.6 * B);
      tl.fromTo(".wk-spine", { yPercent: 105 }, { yPercent: 0, duration: 0.45, stagger: 0.11, ease: "expo.out" }, 15.0);

      // FOLLOW: a figure on each beat
      arrive("#wk-join", 17.1429, 438, 365);
      tl.fromTo(".wk-num", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, stagger: B * 0.75, ease: "expo.out" }, 17.1429 + 0.15);

      // THE FRIEZE between shots: the shot is pushed out to the left, the top of the portico
      // slides in from the right and glides to the next metope (lit in burgundy), and the camera
      // dives into it, as it dived into "Watch" at the end of the pillars
      const MX = [367.0, 695.5, 1028.5, 1361.5, 1695.0, 2025.0];
      const KF = 1.64, CY = 255;
      const outgoing = ["#wk-watch", "#wk-read", "#wk-canon", "#wk-atlas", "#wk-books"];
      tl.set("#fz-pane", { x: 1920 }, 0);
      [2.1429, 6.4286, 10.7143, 15.0, 17.1429].forEach((t, i) => {
        const m = MX[i + 1], t0 = t - 0.78;
        tl.set(".fz-met", { color: "#28231e" }, t0);
        tl.set("#fz-m" + (i + 1), { color: "#470b15" }, t0);
        tl.fromTo(outgoing[i], { x: 0 }, { x: -1920, duration: 0.4, ease: "power3.inOut", immediateRender: false }, t0);
        tl.fromTo("#fz-pane", { x: 1920 }, { x: 0, duration: 0.4, ease: "power3.inOut", immediateRender: false }, t0);
        tl.fromTo("#fz-world", cam(m + 260, CY, KF), { ...cam(m, CY, KF), duration: 0.42, ease: "power2.out", immediateRender: false }, t0);
        tl.fromTo("#fz-world", cam(m, CY, KF), { ...cam(m, 210, 9), duration: 0.32, ease: "power3.in", immediateRender: false }, t - 0.32);
        tl.set("#fz-pane", { x: 1920 }, t);
      });
      // the last metope, Community, fills with burgundy on the way in: the next shot is burgundy
      tl.fromTo("#fz-fill", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power2.in" }, 17.1429 - 0.26);
      tl.fromTo("#fz-m5", { color: "#470b15" }, { color: "#f9f3dd", duration: 0.24, ease: "power2.in", immediateRender: false }, 17.1429 - 0.26);

      window.__timelines["works"] = tl;
    })();
  </script>
