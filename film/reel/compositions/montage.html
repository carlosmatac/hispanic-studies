  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // the three shots with his voice are not timed clips (their videos are): show each in its window

        tl.set(sel, { autoAlpha: 0 }, 0);
        tl.set(sel, { autoAlpha: 1 }, a);
        tl.set(sel, { autoAlpha: 0 }, b);
      });
      // a word lands as he says it
      const say = (sel, ts, from = { opacity: 0, filter: "blur(8px)" }) =>
        document.querySelectorAll(sel + " span").forEach((el, i) => tl.fromTo(el, from, { opacity: 1, filter: "blur(0px)", x: 0, y: 0, duration: 0.13, ease: "power2.out" }, Math.max(0, ts[i] - 0.03)));

      // A: a city a beat (cut on a whip), his window over them; "Spain built them." takes the frame
      const cuts = [0, 0.8, 1.6, 2.4, 3.12], cutEnd = [...cuts.slice(1), 4.4];
      cuts.forEach((t, i) => {
        tl.set("#mt-a" + i, { autoAlpha: 1 }, t);
        if (i < 4) tl.set("#mt-a" + i, { autoAlpha: 0 }, cutEnd[i]);
        if (i > 0) tl.fromTo(`#mt-a${i} img`, { x: (i % 2 ? -220 : 220), filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, t);
        tl.fromTo(`#mt-a${i} img`, { scale: 1.0 }, { scale: 1.07, duration: cutEnd[i] - t, ease: "none" }, t);
      });
      [1, 2, 3, 4].forEach((i) => tl.set("#mt-a" + i, { autoAlpha: 0 }, 0));
      plateIn("#mt-a-plate", 0);
      say("#mt-a-type", [0.08, 0.24, 0.48, 0.78, 0.9, 1.12, 1.62]);
      // on "Spain" the window and the line clear, the plaza opens and the words fill it
      tl.set(["#mt-a-plate", "#mt-a-type", "#mt-a-scrim"], { autoAlpha: 0 }, 3.12);
      tl.fromTo("#mt-a4 img", { scale: 1.25 }, { scale: 1.05, duration: 1.28, ease: "expo.out", immediateRender: false }, 3.12);
      say("#mt-a-big", [3.16, 3.5, 3.94], { opacity: 0, filter: "blur(14px)", y: 30 });

      // B: the camera rises up the altarpiece

      tl.fromTo("#mt-b-bg", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.4);
      plateIn("#mt-b-plate", 4.45);
      say("#mt-b-type", [4.5, 5.0, 5.78], { opacity: 0, x: -50, filter: "blur(10px)" });

      // D: war, law, love, faith: each stamped on its eighth, the picture punched in under it
      [0, 1, 2, 3].forEach((i) => {
        const t = 6.808 + i * 0.4;
        tl.fromTo(`#mt-d${i} img`, { scale: 1.18 }, { scale: 1.04, duration: 0.4, ease: "expo.out" }, t);
        tl.fromTo(`#mt-d${i} .mt-stamp`, { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "expo.out" }, t);

      // C: the music stops; his window opens, the nave drifts, every word on his voice
      tl.fromTo("#mt-c-bg", { scale: 1.1 }, { scale: 1.0, duration: 4.795, ease: "none" }, 8.4);
      plateIn("#mt-c-plate", 8.4);

      window.__timelines["montage"] = tl;
