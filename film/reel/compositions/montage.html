      // a word lands as he says it

      // A: his sentence began in the build ("See, we love our pueblos mágicos, those charming");
      // on the hit his window opens in his pause. Two cities a phrase while he says what they
      // are, then one a beat on "Every single one of them"; "Spain built them." takes the frame.

        if (i < last) tl.set("#mt-a" + i, { autoAlpha: 0 }, cutEnd[i]);

        if (i < last) tl.fromTo(`#mt-a${i} img`, { scale: 1.0 }, { scale: 1.07, duration: cutEnd[i] - t, ease: "none" }, t);

      say("#mt-a-type1", [0.275, 0.705, 1.365, 1.565, 1.765, 1.905, 2.545, 2.785]);

      say("#mt-b-type", [8.45, 8.95, 9.73], { opacity: 0, x: -50, filter: "blur(10px)" });
